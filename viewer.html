<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goswami Parivaar — Screen Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: #201913;
    background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px);
    background-size: 22px 22px;
    color: #F3EAE0;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .topbar { height: 54px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 18px; background: rgba(28, 21, 16, .92); border-bottom: 1px solid #3A2E23; z-index: 10; }
  .topbar .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(150deg, #D96C26, #A8430F); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 11px; color: #fff; }
  .topbar .t { font-size: 14px; font-weight: 700; }
  .cur { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .cur .cid { font-size: 11px; font-weight: 800; letter-spacing: .06em; color: #E8823F; background: rgba(232,130,63,.12); border: 1px solid rgba(232,130,63,.35); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .cur .cname { font-size: 13px; color: #C4B2A0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cur .pos { font-size: 12px; color: #8A7663; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pbtn { height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid #4A3A2B; background: #2A211A; color: #F3EAE0; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; text-decoration: none; white-space: nowrap; }
  .pbtn:hover { background: #352A20; }
  .pbtn.nav { min-width: 40px; justify-content: center; font-size: 16px; }
  .pbtn.primary { background: #C2571B; border-color: #C2571B; color: #fff; }
  .pbtn.primary:hover { background: #A84813; }
  .pbtn[disabled] { opacity: .35; cursor: default; }
  @media (max-width: 860px) { .cur .cname, .topbar .t, .links .pbtn:not(.primary) { display: none; } }

  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0; padding: 16px 16px 10px; position: relative; }
  .sidebtn { position: absolute; top: 50%; transform: translateY(-50%); width: 54px; height: 88px; border-radius: 16px; border: 1px solid #4A3A2B; background: rgba(42,33,26,.9); color: #F3EAE0; font-size: 30px; line-height: 1; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 8; }
  .sidebtn:hover { background: #352A20; }
  .sidebtn.prev { left: 18px; }
  .sidebtn.next { right: 18px; }
  .sidebtn[disabled] { opacity: .25; cursor: default; }
  .fitwrap { position: relative; }
  .phone { width: 406px; height: 860px; background: #FAF6EF; border-radius: 44px; border: 8px solid #0E0A07; box-shadow: 0 30px 70px rgba(0,0,0,.5), inset 0 0 0 2px #3A2E23; overflow: hidden; transform-origin: top center; }
  .phone iframe { width: 390px; height: 844px; border: 0; display: block; background: #FAF6EF; }
  .phone.desktop { width: 1452px; height: 912px; border-radius: 14px; border: 6px solid #0E0A07; }
  .phone.desktop iframe { width: 1440px; height: 900px; }
  .hint { flex: none; padding: 10px 0 14px; font-size: 12px; color: #A5947F; display: flex; align-items: center; gap: 10px; justify-content: center; }
  .hint kbd { background: #2A211A; border: 1px solid #4A3A2B; border-radius: 5px; padding: 1px 7px; font-family: inherit; font-size: 11px; color: #C4B2A0; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">GP</div>
  <div class="t">Screen Viewer</div>
  <div class="cur">
    <span class="cid" id="cur-id">GP-001</span>
    <span class="cname" id="cur-name">Splash</span>
    <span class="pos" id="cur-pos">1 / 65</span>
  </div>
  <button class="pbtn nav" id="btn-prev" title="Previous screen (←)">‹</button>
  <button class="pbtn nav" id="btn-next" title="Next screen (→)">›</button>
  <span class="links" style="display:flex;gap:8px;">
    <a class="pbtn" href="flow.html">Flow map</a>
    <a class="pbtn" href="index.html">Catalogue</a>
    <a class="pbtn primary" href="prototype.html">Prototype</a>
  </span>
</div>

<div class="stage">
  <button class="sidebtn prev" id="side-prev" title="Previous screen (←)">‹</button>
  <button class="sidebtn next" id="side-next" title="Next screen (→)">›</button>
  <div class="fitwrap" id="fitwrap">
    <div class="phone" id="phone"><iframe id="frame" title="Screen" src="gp-001-splash.html#clean"></iframe></div>
  </div>
</div>
<div class="hint">Tap buttons inside the app to navigate · big side arrows / ‹ › above / <kbd>←</kbd><kbd>→</kbd> flip screens</div>

<script>
(function () {
  "use strict";

  var D = 1; // wide/desktop frame flag
  var SCREENS = [
    ["gp-001-splash.html", "GP-001", "Splash"],
    ["gp-002-onboarding.html", "GP-002", "Onboarding (3 slides)"],
    ["gp-003-login.html", "GP-003", "Login"],
    ["gp-004-otp.html", "GP-004", "OTP verification"],
    ["gp-005-forgot-password.html", "GP-005", "Forgot / reset password"],
    ["gp-006-registration-step1.html", "GP-006", "Registration step 1"],
    ["gp-007-registration-step2.html", "GP-007", "Registration step 2"],
    ["gp-008-status-screens.html", "GP-008", "Status screens"],
    ["gp-009-home.html", "GP-009", "Home"],
    ["gp-010-inbox.html", "GP-010", "Inbox"],
    ["gp-011-inbox-detail.html", "GP-011", "Inbox detail"],
    ["gp-012-profile.html", "GP-012", "Profile"],
    ["gp-013-edit-profile.html", "GP-013", "Edit profile"],
    ["gp-014-settings.html", "GP-014", "Settings"],
    ["gp-015-blocked-users.html", "GP-015", "Blocked users"],
    ["gp-016-delete-account.html", "GP-016", "Delete account"],
    ["gp-020-jobs-browse.html", "GP-020", "Jobs browse"],
    ["gp-021-job-detail.html", "GP-021", "Job detail"],
    ["gp-022-post-job.html", "GP-022", "Post a job"],
    ["gp-023-my-jobs.html", "GP-023", "My jobs"],
    ["gp-024-applicants.html", "GP-024", "Applicants"],
    ["gp-025-applicant-detail.html", "GP-025", "Applicant detail"],
    ["gp-026-seeker-profile.html", "GP-026", "Seeker profile"],
    ["gp-027-apply-flow.html", "GP-027", "Apply flow"],
    ["gp-028-my-applications.html", "GP-028", "My applications"],
    ["gp-030-events-browse.html", "GP-030", "Events browse"],
    ["gp-031-event-detail.html", "GP-031", "Event detail (Meet gating)"],
    ["gp-032-create-event.html", "GP-032", "Create event"],
    ["gp-033-my-registrations.html", "GP-033", "My registrations"],
    ["gp-034-attendees.html", "GP-034", "Attendees + CSV"],
    ["mp-010-marketplace-home.html", "MP-010", "Marketplace home"],
    ["mp-011-product-list.html", "MP-011", "List + filters + compare"],
    ["mp-012-product-detail.html", "MP-012", "Product detail"],
    ["mp-013-compare.html", "MP-013", "Compare products"],
    ["mp-020-catalog-manager.html", "MP-020", "Catalog manager (business)"],
    ["mp-021-product-editor.html", "MP-021", "Product editor"],
    ["mp-030-product-reviews.html", "MP-030", "Ratings & reviews"],
    ["mp-090-edge-states.html", "MP-090", "Edge & error states gallery"],
    ["mp-031-review-moderation.html", "MP-031", "Review moderation (report→decision)"],
    ["mp-060-admin-dashboard.html", "MP-060", "Admin dashboard (counts + SLA)"],
    ["mp-061-approval-queue.html", "MP-061", "Listing approval queue (admin)"],
    ["mp-062-categories-manager.html", "MP-062", "Categories manager (admin)"],
    ["gp-050-matrimony-intro.html", "GP-050", "Matrimony intro & consent"],
    ["gp-051-matrimony-profile-setup.html", "GP-051", "Matrimony profile setup"],
    ["gp-052-selfie-capture.html", "GP-052", "Live selfie capture"],
    ["gp-053-matrimony-browse.html", "GP-053", "Matrimony browse"],
    ["gp-054-matrimony-profile-detail.html", "GP-054", "Matrimony profile detail"],
    ["gp-055-interests.html", "GP-055", "Interests"],
    ["gp-056-contact-sharing.html", "GP-056", "Contact sharing"],
    ["gp-057-messages.html", "GP-057", "Moderated messages"],
    ["gp-058-visibility.html", "GP-058", "Visibility settings"],
    ["gp-059-block-report.html", "GP-059", "Block & report"],
    ["gp-060-family-managed.html", "GP-060", "Family-managed profile"],
    ["gp-061-call.html", "GP-061", "Call screen"],
    ["ad-001-login.html", "AD-001", "Admin login + 2FA", D],
    ["ad-002-dashboard.html", "AD-002", "Admin dashboard", D],
    ["ad-003-verification.html", "AD-003", "Verification queue", D],
    ["ad-004-approvals.html", "AD-004", "Approval queues", D],
    ["ad-005-cities.html", "AD-005", "Cities & categories", D],
    ["ad-006-subadmins.html", "AD-006", "Sub Admins", D],
    ["ad-007-broadcast.html", "AD-007", "Broadcast composer", D],
    ["ad-008-users.html", "AD-008", "User management", D],
    ["ad-009-audit.html", "AD-009", "Audit log", D]
  ];

  var frame = document.getElementById("frame");
  var curId = document.getElementById("cur-id");
  var curName = document.getElementById("cur-name");
  var curPos = document.getElementById("cur-pos");
  var btnPrev = document.getElementById("btn-prev");
  var btnNext = document.getElementById("btn-next");
  var phone = document.getElementById("phone");
  var fitwrap = document.getElementById("fitwrap");
  var idx = 0;

  function indexOfFile(f) {
    for (var i = 0; i < SCREENS.length; i++) if (SCREENS[i][0] === f) return i;
    return -1;
  }
  function show(i) {
    idx = Math.max(0, Math.min(SCREENS.length - 1, i));
    var s = SCREENS[idx];
    frame.src = s[0] + "#clean";
    curId.textContent = s[1];
    curName.textContent = s[2];
    curPos.textContent = (idx + 1) + " / " + SCREENS.length;
    btnPrev.disabled = idx === 0;
    btnNext.disabled = idx === SCREENS.length - 1;
    sidePrev.disabled = idx === 0;
    sideNext.disabled = idx === SCREENS.length - 1;
    phone.classList.toggle("desktop", !!s[3]);
    try { history.replaceState(null, "", "#" + s[0]); } catch (e) {}
    document.title = s[1] + " · " + s[2] + " — Goswami Parivaar";
    fit();
  }

  btnPrev.addEventListener("click", function () { show(idx - 1); });
  btnNext.addEventListener("click", function () { show(idx + 1); });
  var sidePrev = document.getElementById("side-prev");
  var sideNext = document.getElementById("side-next");
  sidePrev.addEventListener("click", function () { show(idx - 1); });
  sideNext.addEventListener("click", function () { show(idx + 1); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { show(idx - 1); }
    if (e.key === "ArrowRight") { show(idx + 1); }
  });

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "gp-proto") {
      var i = indexOfFile(e.data.file);
      if (i >= 0 && i !== idx) show(i);
    }
  });

  function fit() {
    var stage = document.querySelector(".stage");
    var wide = phone.classList.contains("desktop");
    var w = wide ? 1452 : 406, h = wide ? 912 : 860;
    var s = Math.min((stage.clientHeight - 10) / h, (stage.clientWidth - 8) / w, 1);
    phone.style.transform = "scale(" + s + ")";
    fitwrap.style.height = (h * s) + "px";
    fitwrap.style.width = (w * s) + "px";
  }

  var initial = decodeURIComponent(location.hash.slice(1));
  var startIdx = indexOfFile(initial);
  show(startIdx >= 0 ? startIdx : 0);
  window.addEventListener("resize", fit);
})();
</script>
</body>
</html>
